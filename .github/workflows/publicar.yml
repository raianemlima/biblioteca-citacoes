name: Publicar
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-audit --no-fund
      - run: npm test
  publicar:
    needs: testes
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Site (o texto dos livros só entra cifrado)
        run: |
          mkdir -p _site/dados
          cp -r index.html app _site/
          touch _site/.nojekyll
      - name: Biblioteca cifrada (segredo BIBLIOTECA_SENHA)
        env:
          BIBLIOTECA_SENHA: ${{ secrets.BIBLIOTECA_SENHA }}
        run: node ferramentas/montar_biblioteca.mjs _site/dados/biblioteca.enc
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@v4
