<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Biblioteca de citações</title>
<style>
:root { --bg:#f6f4ef; --sup:#fffdf8; --tinta:#1f2328; --sub:#5f6672; --linha:#e3ddd0; --pri:#7a2e2e; --pri-t:#fff; --marca:#f6e3a8; --aviso:#8a5a00; --aviso-bg:#fff4dc; --ok:#2f6f4f;
  --f-ui: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; --f-texto: Georgia, "Times New Roman", serif; }
@media (prefers-color-scheme: dark) { :root { --bg:#16181b; --sup:#1f2226; --tinta:#ece7dc; --sub:#a8adb6; --linha:#33373d; --pri:#d98b7a; --pri-t:#1b1012; --marca:#5b4a14; --aviso:#f2c46b; --aviso-bg:#3a2e12; } }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--tinta); font: 16px/1.5 var(--f-ui); -webkit-text-size-adjust: 100%; }
header.topo { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--linha); padding: 10px 16px 0; }
.topo-l { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
.marca { font: 700 1.05rem var(--f-texto); margin: 0; }
.marca small { display: block; font: 500 .75rem var(--f-ui); color: var(--sub); }
nav.abas { display: flex; gap: 4px; margin-top: 8px; }
nav.abas button { flex: 1; border: 0; background: none; color: var(--sub); font: 600 .95rem var(--f-ui); padding: 10px 6px; border-bottom: 3px solid transparent; cursor: pointer; }
nav.abas button[aria-selected="true"] { color: var(--pri); border-bottom-color: var(--pri); }
details.menu { position: relative; }
details.menu summary { list-style: none; cursor: pointer; padding: 6px 10px; border: 1px solid var(--linha); border-radius: 10px; font-size: .9rem; }
details.menu summary::-webkit-details-marker { display: none; }
details.menu .caixa { position: absolute; right: 0; top: 40px; width: min(300px, 86vw); background: var(--sup); border: 1px solid var(--linha); border-radius: 12px; padding: 12px; box-shadow: 0 8px 24px rgba(0,0,0,.12); display: grid; gap: 10px; font-size: .9rem; }
main { max-width: 820px; margin: 0 auto; padding: 14px 16px 120px; }
.cartao, .arg, .livro { background: var(--sup); border: 1px solid var(--linha); border-radius: 14px; padding: 14px; margin: 0 0 12px; }
h2 { font: 700 1.25rem var(--f-texto); margin: 0 0 6px; }
.sub { color: var(--sub); font-size: .9rem; margin: 4px 0 10px; }
textarea, input[type=search], input[type=password], select { width: 100%; font: 16px var(--f-ui); color: var(--tinta); background: var(--bg); border: 1px solid var(--linha); border-radius: 10px; padding: 10px 12px; }
textarea { font-family: var(--f-texto); resize: vertical; min-height: 140px; }
.linha { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 10px; }
.linha input[type=search] { flex: 1 1 220px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 42px; padding: 8px 14px; border-radius: 10px; border: 1px solid var(--linha); background: var(--sup); color: var(--tinta); font: 600 .92rem var(--f-ui); cursor: pointer; text-decoration: none; }
.btn.primario { background: var(--pri); border-color: var(--pri); color: var(--pri-t); }
.btn.leve { background: none; }
.btn:disabled { opacity: .5; cursor: default; }
.arquivo input { position: absolute; width: 1px; height: 1px; opacity: 0; }
.nome-arq { font-size: .85rem; color: var(--sub); overflow-wrap: anywhere; flex: 1 1 120px; }
.resumo { color: var(--sub); font-size: .9rem; margin: 6px 2px 10px; }
.arg header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.chip { font: 700 .72rem var(--f-ui); letter-spacing: .04em; text-transform: uppercase; color: var(--pri); background: color-mix(in srgb, var(--pri) 12%, transparent); padding: 3px 8px; border-radius: 999px; }
blockquote.pet { margin: 0 0 10px; padding: 8px 12px; border-left: 3px solid var(--linha); color: var(--sub); font: .92rem/1.5 var(--f-texto); }
.sug { border-top: 1px dashed var(--linha); padding-top: 10px; margin-top: 10px; }
.arg .sug:first-of-type { border-top: 0; margin-top: 0; padding-top: 0; }
.sug-cab { display: flex; justify-content: space-between; gap: 8px; font-size: .88rem; }
.sug-cab span { color: var(--pri); font-weight: 700; white-space: nowrap; }
.trecho { font: 1rem/1.6 var(--f-texto); margin: 6px 0; overflow-wrap: anywhere; }
mark { background: var(--marca); color: inherit; border-radius: 3px; padding: 0 1px; }
.aviso { background: var(--aviso-bg); color: var(--aviso); border-radius: 8px; padding: 6px 10px; font-size: .84rem; margin: 6px 0; }
.acoes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.usar { display: inline-flex; align-items: center; gap: 6px; min-height: 42px; padding: 0 12px; border: 1px solid var(--ok); color: var(--ok); border-radius: 10px; font-weight: 600; font-size: .92rem; cursor: pointer; }
.usar input { width: 18px; height: 18px; accent-color: var(--ok); }
.barra { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: flex-end; padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--sup); border-top: 1px solid var(--linha); box-shadow: 0 -6px 18px rgba(0,0,0,.08); }
.barra span { margin-right: auto; font-size: .9rem; color: var(--sub); }
.ref { font: .95rem/1.5 var(--f-texto); margin: 0 0 6px; }
.leitor .texto p { font: 1.05rem/1.7 var(--f-texto); text-align: justify; hyphens: auto; margin: 0 0 12px; }
.leitor .texto p.alvo { background: color-mix(in srgb, var(--marca) 55%, transparent); border-radius: 6px; }
.nav-pag { justify-content: space-between; }
.nav-pag label { display: flex; align-items: center; gap: 8px; }
.nav-pag select { width: auto; min-width: 90px; }
.notas summary { cursor: pointer; color: var(--sub); font-size: .9rem; padding: 8px 0; }
.notas p { font-size: .85rem; color: var(--sub); }
.flutua { position: fixed; right: 16px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 7; box-shadow: 0 6px 18px rgba(0,0,0,.2); }
#toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--tinta); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: .9rem; z-index: 9; }
#trava { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
#trava form { width: min(380px, 100%); background: var(--sup); border: 1px solid var(--linha); border-radius: 16px; padding: 20px; display: grid; gap: 12px; }
#trava h1 { font: 700 1.4rem var(--f-texto); margin: 0; }
.vazio b { display: block; margin-bottom: 4px; }
.cap { font-size: .8rem; color: var(--sub); margin: 2px 0 0; }
details.novidade { background: color-mix(in srgb, var(--pri) 8%, transparent); border: 1px solid color-mix(in srgb, var(--pri) 30%, transparent); border-radius: 10px; padding: 6px 10px; margin: 8px 0; font-size: .88rem; }
details.novidade summary { cursor: pointer; color: var(--pri); font-weight: 600; }
details.novidade p { margin: 6px 0; }
details.caps summary { cursor: pointer; color: var(--sub); font-size: .9rem; padding: 6px 0; }
details.caps ol { margin: 4px 0 8px; padding-left: 24px; }
details.caps li { margin: 4px 0; }
.lnk { background: none; border: 0; padding: 0; color: var(--tinta); font: inherit; text-align: left; text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.nov { color: var(--pri); font-weight: 600; }
</style>
</head>
<body>
<div id="trava">
  <form id="tForm">
    <h1>Biblioteca de citações</h1>
    <p class="sub">Livros para citar nas petições, com a página e a referência ABNT. O texto fica cifrado: só abre com a sua senha.</p>
    <input type="password" id="tSenha" autocomplete="current-password" placeholder="Senha" aria-label="Senha" required>
    <label class="sub"><input type="checkbox" id="tLembrar" checked> Lembrar neste aparelho</label>
    <button class="btn primario">Entrar</button>
    <p class="sub" id="tMsg" aria-live="polite"></p>
  </form>
</div>
<div id="app" hidden>
  <header class="topo">
    <div class="topo-l">
      <p class="marca">Biblioteca de citações<small id="cont"></small></p>
      <details class="menu"><summary>Ajustes</summary><div class="caixa">
        <label><input type="checkbox" id="caixaAlta"> Sobrenome em CAIXA ALTA na citação (prática forense). Desmarcado segue a NBR 10520:2023.</label>
        <button class="btn" id="sair">Sair e esquecer neste aparelho</button>
      </div></details>
    </div>
    <nav class="abas" role="tablist">
      <button role="tab" data-aba="peticao" aria-selected="true">Petição</button>
      <button role="tab" data-aba="buscar" aria-selected="false">Buscar</button>
      <button role="tab" data-aba="livros" aria-selected="false">Livros</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div id="toast" hidden role="status"></div>
<script type="module" src="app/main.js"></script>
</body>
</html>
